version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: deepshield_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: deepshield
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: deepshield_api
    restart: always
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: "mysql://root:password@mysql:3306/deepshield"
      JWT_SECRET: "super-secret-jwt-key-deepshield-ai-enterprise-2026"
      JWT_REFRESH_SECRET: "super-secret-refresh-key-deepshield-ai-enterprise-2026"
    ports:
      - "5000:5000"
    depends_on:
      mysql:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: deepshield_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api

volumes:
  mysql_data:
